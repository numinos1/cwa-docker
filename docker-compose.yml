services:
  wordpress:
    container_name: wordpress
    depends_on:
      - db
    image: wordpress:7.1-php8.4-apache
    platform: linux/x86_64
    volumes:
      - ./www/wp-content:/var/www/html/wp-content
      - ./init/prep.sh:/usr/local/bin/prep.sh
      # - ./wordpress:/var/www/html
      # - ./admin:/var/www/html/admin
    ports:
      - '3073:80'
    restart: always
    environment:
      WORDPRESS_DB_HOST: $db_host
      WORDPRESS_DB_USER: $db_user
      WORDPRESS_DB_PASSWORD: $db_password
      WORDPRESS_DB_NAME: $db_name
      WORDPRESS_TABLE_PREFIX: $db_table_prefix
      WORDPRESS_DEBUG: $wp_debug_mode
      DISABLED_PLUGINS: $wp_plugins_to_disable
      WORDPRESS_CONFIG_EXTRA:
       define( 'WP_HOME', 'http://localhost:3073' );
       define( 'WP_SITEURL', 'http://localhost:3073' );
       define( 'WP_DEBUG', true );
       define( 'WP_DEBUG_LOG', true );
       define( 'CWA_ENV', 'dev' );
       
  db:
    container_name: mysql
    image: mysql:8.0
    platform: linux/x86_64
    volumes:
      - ./mysql:/var/lib/mysql
      - ./init/backup.sql.gz:/docker-entrypoint-initdb.d/backup.sql.gz
      - ./init/migrate.sh:/docker-entrypoint-initdb.d/migrate.sh
    restart: always
    ports:
      - '3074:3306'
    environment:
      MYSQL_ROOT_PASSWORD: $db_root_password
      MYSQL_DATABASE: $db_name
      MYSQL_USER: $db_user
      MYSQL_PASSWORD: $db_password
      WORDPRESS_TABLE_PREFIX: $db_table_prefix
      PRODUCTION_URL: $production_url
      PROD_ADMIN_URL: $prod_admin_url
      DEV_URL: $dev_url
  # phpmyadmin
  phpmyadmin:
    depends_on:
      - db
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - '8080:80'
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: $db_root_password
